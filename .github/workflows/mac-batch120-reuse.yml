name: macOS batch120 exact artifact QA retry
on:
  workflow_dispatch:
    inputs:
      resume_mac_arm64:
        description: 'Run the authorized native APP and DMG QA repair against the original signed 1.1.20 artifact'
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  batch120:
    if: inputs.resume_mac_arm64 == true
    strategy:
      fail-fast: false
      matrix:
        stage: [app, dmg]
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Strict original source, QA-only differences and binding contracts
        run: |
          node --test scripts/verify-mac-batch120-reuse-tests.cjs
          node -e "require('./scripts/verify-mac-batch120-reuse.cjs').proveReuseSource('16becb4cbdb1f78f4a3efa4b335361a89282ba36',process.env.GITHUB_SHA)"
      - name: Read immutable original package run and artifact provenance
        uses: actions/github-script@v7
        with:
          script: |
            const assert = require('node:assert/strict')
            const fs = require('node:fs')
            const base = { owner: context.repo.owner, repo: context.repo.repo, run_id: 37656162154 }
            const run = (await github.rest.actions.getWorkflowRun(base)).data
            assert.equal(run.head_sha, '16becb4cbdb1f78f4a3efa4b335361a89282ba36')
            assert.equal(run.event, 'workflow_dispatch')
            assert.equal(run.path, '.github/workflows/mac-build.yml')
            assert.equal(run.repository.full_name, context.repo.owner + '/' + context.repo.repo)
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, { ...base, per_page: 100 })
            const packageJobs = jobs.filter(j => j.name === 'package (macos-26, arm64)')
            assert.equal(packageJobs.length, 1)
            assert.equal(packageJobs[0].conclusion, 'success')
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, { ...base, per_page: 100 })
            const matches = artifacts.filter(a => a.name === 'mac-packages-arm64')
            assert.equal(matches.length, 1)
            assert.equal(matches[0].id, 11500140550)
            assert.equal(matches[0].digest, 'sha256:6a91272060a7a2df607cadc6131f5ccae6d7ec30d915ae75e5c73ec3826e78e9')
            assert.equal(matches[0].expired, false)
            assert.equal(matches[0].workflow_run.head_sha, run.head_sha)
            fs.mkdirSync('release', { recursive: true })
            fs.writeFileSync('release/artifact-origin120.json', JSON.stringify({ run, packageJob: packageJobs[0], artifact: matches[0] }, null, 2))
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: 11500140550
          run-id: 37656162154
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release
      - name: Enable actual desktop material
        run: defaults write com.apple.universalaccess reduceTransparency -bool false
      - name: Original signed bytes, current bounded QA and actual native four-theme APP or DMG
        run: node scripts/verify-mac-batch120-reuse.cjs ${{ matrix.stage }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-batch120-reuse-arm64-${{ matrix.stage }}
          path: |
            release/artifact-origin120.json
            release/mac-batch120-reuse-*
            release/mac-batch120-proof-*
          if-no-files-found: error

name: macOS packages
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['.github/workflows/mac-build.yml', 'src/**', 'tests/**', 'scripts/**', 'native/**', 'bridge/**', 'build/**', 'package.json', 'package-lock.json', 'electron.vite.config.ts', 'tsconfig*.json', 'LICENSE', 'THIRD_PARTY_NOTICES.md', 'licenses/**', 'docs/CORRESPONDING_SOURCE.md']
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run license:check
      - run: node scripts/build-bridge.cjs
      - run: node scripts/verify-bridge-exit.cjs
      - name: Package exact shared runtime, local signature, ZIP and DMG
        run: node scripts/pack-mac.mjs ${{ matrix.arch }} --package-only
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-packages-${{ matrix.arch }}
          path: |
            release/*-mac-*.zip
            release/*-mac-*.dmg
            release/SHA256SUMS-mac-*.txt
            release/mac-package-*.json
          if-no-files-found: error
  ui:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            stage: app
          - runner: macos-15
            arch: arm64
            stage: dmg
          - runner: macos-15-intel
            arch: x64
            stage: app
          - runner: macos-15-intel
            arch: x64
            stage: dmg
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: mac-packages-${{ matrix.arch }}
          path: release
      - name: Enable desktop material in disposable native session
        run: defaults write com.apple.universalaccess reduceTransparency -bool false
      - name: Validate exact APP or mounted DMG and current common feature evidence
        run: node scripts/verify-mac-job.cjs ui ${{ matrix.arch }} ${{ matrix.stage }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-ui-${{ matrix.arch }}-${{ matrix.stage }}
          path: |
            release/mac-proof-*
            release/mac-job-*
          if-no-files-found: error
  parity:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: mac-packages-${{ matrix.arch }}
          path: release
      - name: Enable desktop material in disposable native session
        run: defaults write com.apple.universalaccess reduceTransparency -bool false
      - name: Full navigation coordinates, offline persistence, queue limit and real public MOD install
        run: node scripts/verify-mac-job.cjs parity ${{ matrix.arch }} app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-parity-${{ matrix.arch }}-app
          path: |
            release/mac-parity-proof-*
            release/mac-job-*
          if-no-files-found: error
  game:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: mac-packages-${{ matrix.arch }}
          path: release
      - name: Actual native Minecraft installation, world, save, focus and Dock reopening
        run: node scripts/verify-mac-job.cjs game ${{ matrix.arch }} app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-game-${{ matrix.arch }}
          path: |
            release/mac-game-proof-*
            release/mac-job-*
          if-no-files-found: error
  integration:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            group: startup
          - runner: macos-15
            arch: arm64
            group: tools
          - runner: macos-15
            arch: arm64
            group: update
          - runner: macos-15-intel
            arch: x64
            group: startup
          - runner: macos-15-intel
            arch: x64
            group: tools
          - runner: macos-15-intel
            arch: x64
            group: update
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: mac-packages-${{ matrix.arch }}
          path: release
      - name: Build local test coordinators from this exact source
        run: |
          node scripts/build-bridge.cjs
          npm run build
      - name: Independent native startup, network tools or transactional update
        run: node scripts/verify-mac-job.cjs ${{ matrix.group }} ${{ matrix.arch }} app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-${{ matrix.group }}-${{ matrix.arch }}
          path: |
            release/mac-extra-*
            release/mac-tools-proof-*
            release/mac-job-*
          if-no-files-found: error

  intel-gpu-diagnostic:
    # Separate, bounded evidence collection only. The failed formal UI job keeps
    # its original result and parameters; this job cannot satisfy acceptance.
    needs: [package, ui]
    if: always() && needs.package.result == 'success' && needs.ui.result == 'failure'
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: mac-packages-x64
          path: release
      - name: Isolated exact-runtime GPU initialization diagnostics; no acceptance override
        run: node scripts/verify-mac-job.cjs gpu-diagnostic x64 app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-gpu-diagnostic-x64
          path: |
            release/mac-gpu-diagnostic-*
            release/mac-job-*
          if-no-files-found: error
